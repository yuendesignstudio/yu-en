<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ — Karan Products</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="YU-EN Design Studio">
<meta property="og:title" content="お問い合わせ — Karan Products">
<meta property="og:image" content="https://yuendesignstudio.github.io/yu-en/images/brand/ogp.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Karan Products</a>
      <nav class="site-nav">
        <ul>
          <li><a href="items.html">商品一覧</a></li>
          <li><a href="contact.html" class="active">お問い合わせ</a></li>
          <li class="lang-switch">
            <a href="contact.html" class="current">JP</a>
            <span style="color:var(--light)">/</span>
            <a href="en/contact.html">EN</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page-top">
    <div class="page-top-inner">
      <p class="hero-label">お問い合わせ</p>
      <h1 class="page-title">Contact</h1>
    </div>
  </div>

  <div class="section">
    <div class="form-wrap">
      <p class="concept-text" style="margin-bottom: 40px;">
        すべての家具は受注生産・一点ものです。価格は個別のお見積りとなります。<br>
        気になる家具のお名前やご希望のサイズ・素材などをお書きいただくと、スムーズにご案内できます。<br>
        2〜3営業日以内にご返信いたします。
      </p>

      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" placeholder="山田 太郎" required />
        </div>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" placeholder="example@mail.com" required />
        </div>
        <div class="form-group">
          <label for="subject">お問い合わせ種別</label>
          <select id="subject" name="subject">
            <option value="">— 選択してください —</option>
            <option>家具のオーダーについて相談したい</option>
            <option>商品について知りたい</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="item">気になる家具（任意）</label>
          <input type="text" id="item" name="item" placeholder="例：家具名 01" />
        </div>
        <div class="form-group">
          <label for="size">ご希望のサイズ・素材・用途（任意）</label>
          <input type="text" id="size" name="size" placeholder="例：幅120cm程度、リビングで使いたい" />
        </div>
        <div class="form-group">
          <label for="budget">ご予算感（任意）</label>
          <input type="text" id="budget" name="budget" placeholder="例：3万円前後" />
        </div>
        <div class="form-group">
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" placeholder="内容をご記入ください" required></textarea>
        </div>
        <button type="submit" class="btn">送信する</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">Karan Products</div>
      <div class="footer-links">
        <a href="tokushoho.html">特定商取引法</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="terms.html">利用規約</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <p class="footer-copy">&copy; 2026 Karan Products</p>
    </div>
  </footer>

</body>
</html>
