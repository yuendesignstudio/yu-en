<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません ｜ YU-EN Design Studio</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--font:"FOT-筑紫ゴシック Std","FOT-TsukuGoStd","Tsukushi A Gothic","筑紫ゴシック","Noto Sans JP","Hiragino Sans",sans-serif;
        --paper:#F6F2EA;--ink:#26231F;--ink-soft:#6B655C;--accent:#F2C9A5;--accent-ink:#A05F26;--line:#E2DBCE}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);font-weight:300;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;
       line-height:2;letter-spacing:.03em}
  .box{max-width:520px;text-align:center}
  .mark{font-size:.72rem;letter-spacing:.34em;color:var(--ink-soft);margin-bottom:34px}
  h1{font-size:clamp(1.2rem,3.4vw,1.6rem);font-weight:400;line-height:1.8;letter-spacing:.05em}
  p{margin-top:22px;font-size:.94rem;color:var(--ink-soft)}
  .rule{width:60px;height:2px;background:var(--accent);margin:34px auto}
  a{display:inline-block;margin-top:8px;color:var(--accent-ink);text-decoration:none;
    border-bottom:1px solid var(--accent);padding-bottom:3px;font-size:.92rem;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="box">
    <p class="mark">YU-EN&nbsp;&nbsp;DESIGN&nbsp;STUDIO</p>
    <h1>お探しのページは<br>見つかりませんでした。</h1>
    <div class="rule"></div>
    <p>移動または削除された可能性があります。</p>
    <a href="/yu-en/">作品一覧へ戻る →</a>
  </div>
</body>
</html>
