<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名刺 ｜ YU-EN Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ★ 筑紫ゴシックのWebフォント（Adobe Fonts）を使う場合は、ここに kit の1行を貼ってください -->
<!-- <link rel="stylesheet" href="https://use.typekit.net/XXXXXXX.css"> -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
  /* 全文 FOT-筑紫ゴシックStd で統一（未導入の環境では Noto Sans JP に落ちる） */
  --font:"FOT-筑紫ゴシック Std","FOT-TsukuGoStd","Tsukushi A Gothic","筑紫ゴシック","Tsukushi Gothic","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
 --paper:#F6F2EA; --ink:#26231F; --ink-soft:#6B655C; --accent:#F2C9A5; --accent-ink:#A05F26; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#cfc9bd;font-family:var(--font);
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 12px;color:var(--ink)}
  .hint{max-width:620px;font-size:13px;color:#40382e;line-height:1.8;text-align:center;background:#F6F2EA;
    border:1px solid #b9b2a4;border-radius:6px;padding:12px 16px}
  .lab{font-size:11px;letter-spacing:.2em;color:#4a433a;text-transform:uppercase}

  /* 名刺 91mm × 55mm（日本標準） */
  .card{width:91mm;height:55mm;position:relative;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.25)}

  /* ── 表：名前だけ、中央 ── */
  .front{background:var(--paper);display:flex;align-items:center;justify-content:center}
  .front .name{font-family:var(--font);font-weight:500;
    font-size:27px;letter-spacing:.22em;color:var(--ink)}

  /* ── 裏：ブランドと連絡先 ── */
  .back{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .back .wm{font-family:var(--font);font-weight:500;font-size:23px;letter-spacing:.2em}
  .back .sub{font-size:7px;letter-spacing:.42em;color:#B8B1A6;margin-top:5px}
  .back .rule{width:24px;height:1px;background:var(--accent);margin:14px 0}
  .back .tag{font-family:var(--font);font-size:10px;letter-spacing:.18em;color:#fff}
  .back .email{font-family:var(--font);font-size:11px;letter-spacing:.06em;
    color:var(--accent-ink);margin-top:12px}
  .back .loc{font-size:7.5px;letter-spacing:.34em;color:#B8B1A6;margin-top:6px;text-transform:uppercase}

  @media print{
    body{background:#fff;padding:0;gap:0}
    .hint,.lab{display:none}
    .card{box-shadow:none;page-break-after:always}
  }
</style>
</head>
<body>

  <div class="hint">
    YU-EN Design Studio 名刺（日本標準 91×55mm・表／裏）。<br>
    印刷：ブラウザの印刷 → <b>拡大縮小100%（実寸）</b>で。入稿時の塗り足し・トンボは印刷所の指定に合わせて調整してください。
  </div>

  <!-- 表：名前だけ -->
  <p class="lab">表 / Front</p>
  <div class="card front">
    <div class="name">Ayato Hokkyo</div>
  </div>

  <!-- 裏：ブランド＋連絡先 -->
  <p class="lab">裏 / Back</p>
  <div class="card back">
    <div class="wm">YU-EN</div>
    <div class="sub">DESIGN STUDIO</div>
    <div class="rule"></div>
    <div class="tag">世話する建築</div>
    <div class="email">yuen.designstudio@gmail.com</div>
    <div class="loc">Tokyo, Japan</div>
  </div>

</body>
</html>
